<header class="site-header" data-header>
  <div class="nav-wrap">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.name }} home">
      <span class="brand-mark">JEP</span>
      <span class="brand-copy"><strong>{{ site.name }}</strong><small>{{ site.role }}</small></span>
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-nav-toggle>Menu</button>
    <nav id="site-nav" class="site-nav" data-nav>
      {% for item in site.data.navigation %}
      <a href="{{ item.url | relative_url }}" {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.label }}</a>
      {% endfor %}
      {% include social.html %}
    </nav>
  </div>
</header>
