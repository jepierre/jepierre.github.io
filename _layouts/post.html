---
layout: default
---
<article class="page-shell article-shell">
  <header class="page-header">
    <p class="eyebrow">TECHNICAL NOTE · {{ page.date | date: "%B %Y" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="page-deck">{{ page.description }}</p>{% endif %}
  </header>
  <div class="prose">{{ content }}</div>
</article>
